name: Publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

      - name: Check source
        run: make check

      - name: Test with race detector
        run: go test -race ./...

      - name: Check image contract
        run: make image-check

      - name: Run container fixture acceptance
        run: make container-test

      - name: Generate image metadata
        id: metadata
        run: |
          short_sha=$(printf '%s' "${{ github.sha }}" | cut -c1-12)
          printf 'tag=build-%s-%s\n' "${{ github.run_id }}" "$short_sha" >> "$GITHUB_OUTPUT"
          build_date=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
          printf 'build_date=%s\n' "$build_date" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            saltydk/vrising:latest
            saltydk/vrising:${{ steps.metadata.outputs.tag }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=registry,ref=saltydk/vrising:buildcache
          cache-to: type=registry,ref=saltydk/vrising:buildcache,mode=max
          build-args: |
            VERSION=${{ steps.metadata.outputs.tag }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          labels: |
            org.opencontainers.image.source=https://github.com/saltydk/docker-vrising
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.tag }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
            org.opencontainers.image.description=Runtime control plane for installing and running the V Rising dedicated server
